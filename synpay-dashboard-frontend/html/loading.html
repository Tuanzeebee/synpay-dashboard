<!DOCTYPE html>
<html lang="vi" style="height: auto; min-height: 100%;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đang Tải - HR Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link id="heading-font-link" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link id="body-font-link" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['var(--font-heading-name)', 'sans-serif'],
                        body: ['var(--font-body-name)', 'sans-serif'],
                    },
                    spacing: {
                        base: 'var(--space-base)',
                    },
                    borderRadius: {
                        small: 'var(--radius-small)',
                        large: 'var(--radius-large)',
                    },
                    boxShadow: {
                        custom: 'var(--shadow-custom)',
                        'custom-hover': 'var(--shadow-custom-hover)',
                    },
                }
            }
        }
    </script>
    <style>
        :root {
            --font-heading-name: 'Inter';
            --font-body-name: 'Inter';
            --font-heading: 'Inter', sans-serif;
            --font-body: 'Inter', sans-serif;
            --letter-spacing-heading: -0.02em;
            --letter-spacing-body: 0em;
            
            --space-base: 1rem;
            
            --radius-small: 0.5rem;
            --radius-large: 0.75rem;
            --border-width: 1px;
            
            --shadow-color: 0 0 0;
            --shadow-offset-x: 0px;
            --shadow-offset-y: 1px;
            --shadow-blur: 3px;
            --shadow-spread: 0px;
            --shadow-opacity: 0.1;
            --shadow-custom: 0px 1px 3px 0px rgba(0, 0, 0, 0.1);
            --shadow-custom-hover: 0px 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        @keyframes bounce-dots {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
        
        .spin-animation {
            animation: spin 1s linear infinite;
        }
        
        .pulse-animation {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        
        .dot-1 { animation: bounce-dots 1.4s infinite ease-in-out both; animation-delay: -0.32s; }
        .dot-2 { animation: bounce-dots 1.4s infinite ease-in-out both; animation-delay: -0.16s; }
        .dot-3 { animation: bounce-dots 1.4s infinite ease-in-out both; }
    </style>
</head>
<body style="height: auto; min-height: 100%;" class="font-body bg-gradient-to-br from-slate-50 to-slate-100 dark:from-slate-900 dark:to-slate-800 text-slate-900 dark:text-slate-100 transition-colors duration-300">

    <div class="flex flex-col">
        <!-- Main Loading Content -->
        <main class="flex items-center justify-center p-4 max-h-[600px]">
            <div class="max-w-sm w-full">
                <!-- Loading Card -->
                <div class="bg-white dark:bg-slate-800 rounded-large border border-slate-200 dark:border-slate-700 shadow-custom-hover p-8 text-center">
                    
                    <!-- Logo -->
                    <div class="flex justify-center mb-6">
                        <div class="w-16 h-16 bg-gradient-to-br from-blue-600 to-blue-700 dark:from-blue-500 dark:to-blue-600 rounded-large flex items-center justify-center text-white font-bold text-2xl shadow-custom pulse-animation">
                            H
                        </div>
                    </div>

                    <!-- Brand Name -->
                    <h1 class="font-heading font-bold text-xl text-slate-800 dark:text-white mb-2">
                        HR Nexus
                    </h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mb-6">
                        Phiên Bản Doanh Nghiệp
                    </p>

                    <!-- Spinner -->
                    <div class="flex justify-center mb-6">
                        <div class="relative w-12 h-12">
                            <div class="absolute inset-0 border-4 border-slate-200 dark:border-slate-700 rounded-full"></div>
                            <div class="absolute inset-0 border-4 border-blue-600 dark:border-blue-500 rounded-full border-t-transparent spin-animation"></div>
                        </div>
                    </div>

                    <!-- Loading Text -->
                    <p class="text-slate-600 dark:text-slate-400 text-sm mb-4">
                        Đang tải dữ liệu
                    </p>

                    <!-- Animated Dots -->
                    <div class="flex items-center justify-center gap-1.5">
                        <div class="w-2 h-2 bg-blue-600 dark:bg-blue-500 rounded-full dot-1"></div>
                        <div class="w-2 h-2 bg-blue-600 dark:bg-blue-500 rounded-full dot-2"></div>
                        <div class="w-2 h-2 bg-blue-600 dark:bg-blue-500 rounded-full dot-3"></div>
                    </div>

                    <!-- Progress Bar (Optional) -->
                    <div class="mt-6">
                        <div class="w-full h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full overflow-hidden">
                            <div class="h-full bg-gradient-to-r from-blue-600 to-blue-500 dark:from-blue-500 dark:to-blue-400 rounded-full" style="width: 0%; animation: progress 2s ease-in-out infinite;">
                            </div>
                        </div>
                    </div>

                </div>

                <!-- Additional Info (Optional) -->
                <p class="text-center text-xs text-slate-500 dark:text-slate-400 mt-4">
                    Vui lòng đợi trong giây lát...
                </p>
            </div>
        </main>
    </div>

    <style>
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
    </style>

    <script>
        // Auto redirect after 3 seconds (for demo purposes)
        setTimeout(function() {
            // window.location.href = '/dashboard';
            console.log('Loading complete - redirect to dashboard');
        }, 3000);

        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
        });

        lucide.createIcons();
    </script>
</body>
</html>
