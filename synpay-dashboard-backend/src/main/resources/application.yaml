server:
  port: 8080

spring:
  application:
    name: synpay-dashboard
  main:
    banner-mode: off

  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true

  datasource:
    hr:
      jdbc-url: jdbc:sqlserver://localhost:1433;databaseName=HUMAN;encrypt=true;trustServerCertificate=true
      username: sa
      password: Ilovedu20@
      driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

    payroll:
      jdbc-url: jdbc:mysql://localhost:3306/payroll?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: Ilovedu20@
      driver-class-name: com.mysql.cj.jdbc.Driver

    auth:
      jdbc-url: jdbc:mysql://localhost:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: Ilovedu20@
      driver-class-name: com.mysql.cj.jdbc.Driver

app:
  jwt:
    secret: synpay-dashboard-jwt-secret-key-2026-must-be-at-least-32-bytes-long
    expiration-ms: 900000           # 15 minutes (access token)
    refresh-expiration-ms: 604800000  # 7 days (refresh token)

  internal:
    api-key: synpay-internal-gateway-key-2026

logging:
  level:
    root: WARN
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
    com.companyx.synpay_dashboard: INFO